<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111314"><title>Vault Run — Trust is a gamble</title>
<style>
:root{color-scheme:dark;--bg:#111314;--panel:#191c1d;--panel2:#202425;--ink:#f5f0e6;--muted:#a9aaa4;--line:#343938;--gold:#f4bd55;--green:#8de0ae;--red:#fb7968;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#303024 0,transparent 40%),var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:25px 26px 48px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px}.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:.13em;font-size:13px}.mark{width:32px;height:32px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:18px;transform:rotate(45deg)}.mark span{transform:rotate(-45deg)}.topnote{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:48px;margin-top:54px}.main{min-width:0}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.hero h1{font:clamp(54px,9vw,94px)/.91 var(--serif);letter-spacing:-.06em;margin:19px 0 20px;max-width:660px}.hero h1 em{color:var(--gold);font-weight:400}.lead{color:#c1c1ba;max-width:560px;line-height:1.65;font-size:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0 24px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:14px 20px;border-radius:6px;font-weight:700;transition:.15s}.btn:hover{border-color:var(--gold);transform:translateY(-1px)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1710}.btn.primary:hover{background:#ffd27a}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.formrow{display:flex;gap:8px;margin:12px 0}.field{background:#101212;border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:13px 14px;min-width:0;outline:none}.field:focus{border-color:var(--gold)}.namefield{width:220px}.codefield{width:120px;text-transform:uppercase;letter-spacing:.16em}.formbox{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:17px;max-width:520px}.formbox h3{font:24px var(--serif);margin:0 0 12px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin:12px 0 6px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.rules{border-left:1px solid var(--line);padding-left:24px;color:#c7c6bf}.rules h2{font:26px var(--serif);color:var(--ink);margin:0 0 18px}.rule{display:flex;gap:12px;margin:16px 0;font-size:13px;line-height:1.5}.rule b{color:var(--gold);font:16px var(--serif);min-width:20px}.rule strong{color:var(--ink)}.callout{margin-top:24px;padding:14px;background:#211f17;border:1px solid #45402d;border-radius:5px;color:#e8d9b2;font-size:12px;line-height:1.6}.screenhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.screenhead h1{font:clamp(38px,7vw,62px)/1 var(--serif);margin:8px 0}.room-code{background:#24251e;border:1px solid #52482f;color:var(--gold);padding:9px 12px;border-radius:5px;letter-spacing:.22em;font-weight:800;font-size:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:21px;margin:18px 0}.cardtitle{color:var(--muted);text-transform:uppercase;letter-spacing:.13em;font-size:11px;margin-bottom:16px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#202323;border:1px solid #2c302f;border-radius:5px}.person{display:flex;align-items:center;gap:10px;min-width:0}.avatar{background:#34352d;color:var(--gold);width:29px;height:29px;display:grid;place-items:center;border-radius:50%;font:14px var(--serif)}.playername{font-weight:600;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-left:4px}.statusdot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}.statusdot.off{background:#777}.empty{color:#777;font-size:13px;padding:12px}.roomfooter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.notice{color:var(--muted);font-size:13px;line-height:1.5}.rulecompact{font-size:13px;line-height:1.65;color:#c8c5bb}.rulecompact strong{color:var(--gold)}.roundtop{text-align:center;margin:10px 0 20px}.roundtop h1{font:clamp(40px,8vw,70px) var(--serif);margin:8px 0}.vault{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font:20px var(--serif)}.vaultnum{font-size:42px}.timer{margin:17px auto;width:min(390px,100%);height:7px;background:#2a2d2b;border-radius:9px;overflow:hidden}.timerbar{height:100%;background:var(--gold);width:100%;transition:width .3s linear}.timerlabel{color:var(--muted);font-size:12px}.secret{min-height:56px;padding:15px 18px;background:#201e16;border:1px solid #55482d;color:#f4d895;border-radius:6px;max-width:560px;margin:15px auto;text-align:center;line-height:1.5;font-size:14px}.choicebuttons{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:560px;margin:24px auto}.choice{border-radius:7px;min-height:104px;font:28px var(--serif);border:1px solid #595345;background:#1e201e;color:var(--ink)}.choice span{display:block;font:11px var(--sans);color:var(--muted);margin-top:8px;letter-spacing:.08em;text-transform:uppercase}.choice.share:hover{border-color:var(--green)}.choice.grab:hover{border-color:var(--gold)}.lockedbox{text-align:center;padding:27px;border:1px solid var(--line);background:var(--panel);border-radius:7px;max-width:560px;margin:22px auto;color:var(--muted);line-height:1.7}.lockedbox strong{color:var(--green)}.revealhead{text-align:center;margin:12px 0 20px}.revealhead h1{font:clamp(42px,8vw,70px) var(--serif);margin:8px}.outcome{color:var(--gold);font:21px var(--serif)}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:#202323;padding:12px;border-radius:5px;font-size:13px}.pick{color:#ddd;font-size:11px;letter-spacing:.08em}.pick.GRAB{color:var(--gold)}.pick.SHARE{color:var(--green)}.gain{color:var(--gold);font-weight:700}.score{font-weight:700}.carry{text-align:center;padding:14px;background:#211f17;border:1px solid #45402d;border-radius:5px;margin-top:14px;color:#e8d9b2;font-size:13px}.fine{font-size:12px;color:var(--muted);line-height:1.5}.finaltable{width:100%;border-collapse:collapse}.finaltable td{padding:13px;border-bottom:1px solid var(--line)}.finaltable tr:first-child td{color:var(--gold)}.rank{color:var(--muted);width:36px}.total{text-align:right;font-weight:800}.error{color:#ff9586;background:#2b1c1a;border:1px solid #5a302c;padding:11px 13px;border-radius:5px;margin:13px 0;font-size:13px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#252824;border:1px solid var(--line);padding:12px 17px;border-radius:5px;color:var(--ink);font-size:13px;z-index:9}.bottomrules{display:none}.smallbutton{padding:9px 12px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr;gap:28px;margin-top:34px}.rules{border-left:0;border-top:1px solid var(--line);padding:22px 0 0}.shell{padding:18px 16px 40px}.topnote{font-size:10px}.hero h1{font-size:clamp(54px,14vw,82px)}.players,.resultgrid{grid-template-columns:1fr}.namefield{flex:1}.formrow{flex-wrap:wrap}.rules h2{font-size:23px}.card{padding:16px}}@media(max-width:420px){.screenhead{flex-direction:column}.room-code{align-self:flex-start}.choice{min-height:88px}.top{padding-bottom:12px}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><div class="mark"><span>V</span></div><span>VAULT RUN</span></div><div class="topnote">Trust is a gamble</div></header><div id="app"></div></div><div id="toast"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app'),toastEl=document.getElementById('toast');
var state={screen:'home',room:null,round:null,hint:null,reveal:null,final:null,error:'',locked:false,lockedCount:0,total:0,seconds:45};
var saved=null;try{saved=JSON.parse(localStorage.getItem('vaultRunSeat')||'null')}catch(e){}
var socket=null, reconnecting=false, timerInterval=null, reconnectTimer=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function send(event,data){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(Object.assign({event:event},data||{})))}
function connect(){var scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(scheme+'//'+location.host);socket.onopen=function(){if(saved&&saved.code&&saved.token){reconnecting=true;send('reconnect',{code:saved.code,token:saved.token})}else render()};socket.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(_){return}handle(m)};socket.onclose=function(){clearInterval(timerInterval);if(state.screen!=='home'){showToast('Connection lost. Reconnecting…')}if(!reconnectTimer)reconnectTimer=setTimeout(function(){reconnectTimer=null;connect()},1500)};socket.onerror=function(){}};
function handle(m){switch(m.event){case'room_created':case'joined_room':
 reconnecting=false;
 if(m.token){saved={code:m.code,token:m.token,playerId:m.playerId};localStorage.setItem('vaultRunSeat',JSON.stringify(saved))}
 else if(m.code){saved=saved||{code:m.code,token:''};saved.code=m.code;saved.playerId=m.playerId;localStorage.setItem('vaultRunSeat',JSON.stringify(saved))}
 state.error='';state.screen='lobby';send('ping');render();break;
 case'lobby_update':state.room=m;state.screen='lobby';render();break;
 case'game_started':state.hint=null;state.reveal=null;state.final=null;break;
 case'round_started':state.screen='round';state.round=m;state.locked=!!m.locked;state.hint=null;state.seconds=Math.max(0,Math.ceil((m.deadline-Date.now())/1000));startClock();render();break;
 case'insider_hint':state.hint=m;render();break;
 case'choice_locked':state.locked=!!m.locked;state.lockedCount=m.lockedCount||0;state.total=m.total||0;render();break;
 case'choice_progress':state.lockedCount=m.lockedCount||0;state.total=m.total||0;render();break;
 case'round_revealed':clearInterval(timerInterval);state.screen='reveal';state.reveal=m;state.intermission=null;state.locked=false;render();break;
 case'round_intermission':state.intermission=m;if(state.reveal){state.screen='reveal';render()}break;
 case'game_finished':clearInterval(timerInterval);state.screen='final';state.final=m;render();break;
 case'game_reset':state.screen='lobby';state.final=null;state.reveal=null;state.locked=false;render();break;
 case'left_room':saved=null;localStorage.removeItem('vaultRunSeat');state.screen='home';state.room=null;render();break;
 case'room_expired':saved=null;localStorage.removeItem('vaultRunSeat');state.screen='home';state.room=null;state.error='This room expired after 30 minutes of inactivity.';render();break;
 case'error':state.error=m.message||'Something went wrong.';if(reconnecting){reconnecting=false;saved=null;localStorage.removeItem('vaultRunSeat');state.screen='home'}render();break;
 }}
function startClock(){clearInterval(timerInterval);timerInterval=setInterval(function(){if(state.round){state.seconds=Math.max(0,Math.ceil((state.round.deadline-Date.now())/1000));var n=document.getElementById('timerlabel');var bar=document.getElementById('timerbar');if(n)n.textContent=state.seconds+' seconds remaining';if(bar)bar.style.width=(state.seconds/45*100)+'%';}},250)}
function showToast(s){toastEl.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(function(){toastEl.innerHTML=''},2600)}
function rules(){return '<aside class="rules"><h2>How to play</h2><div class="rule"><b>01</b><div><strong>Five rounds.</strong> A vault starts with 6 coins. Each round adds 2, plus any coins left over.</div></div><div class="rule"><b>02</b><div>Secretly choose <strong>SHARE</strong> or <strong>GRAB</strong>. Your pick stays hidden until everyone has locked in.</div></div><div class="rule"><b>03</b><div>If everyone shares, split the vault equally. If anyone grabs, only grabbers split it. If everyone grabs, the alarm pays nobody.</div></div><div class="rule"><b>04</b><div>Each round has a secret <strong>Insider</strong>, who sees one other player’s choice if time allows. The Insider is never identified.</div></div><div class="rule"><b>05</b><div>Unclaimed coins use <strong>floor division</strong> and carry into the next vault. Fifth-round leftovers are discarded.</div></div><div class="rule"><b>06</b><div>You have <strong>45 seconds</strong>. If time runs out—or a player disconnects before choosing—they count as SHARE.</div></div><div class="callout">3–6 players · Highest coin total after round 5 wins. Ties share the win.</div></aside>'}
function home(){return '<div class="layout"><main class="main"><div class="hero"><div class="eyebrow">A game of nerve · 3—6 players</div><h1>Trust is a<br><em>gamble.</em></h1><p class="lead">Five rounds. One vault. Every player makes a secret choice, and one of you gets a peek behind the curtain.</p><div class="actions"><button class="btn primary" id="createToggle">Create Room</button><button class="btn ghost" id="joinToggle">Join Room</button></div><div id="formArea"></div>'+(state.error?'<div class="error">'+esc(state.error)+'</div>':'')+'</div></main>'+rules()+'</div>'}
function form(kind){var area=document.getElementById('formArea');if(!area)return;area.innerHTML=kind==='create'?'<div class="formbox"><h3>Create a room</h3><label class="label">Your name</label><div class="formrow"><input class="field namefield" id="createName" maxlength="20" placeholder="Name" autocomplete="nickname"><button class="btn primary" id="createSubmit">Create room</button></div><div class="hint">You’ll be the host. Invite 2–5 friends with your room code.</div></div>':'<div class="formbox"><h3>Join a room</h3><label class="label">Your name</label><input class="field namefield" id="joinName" maxlength="20" placeholder="Name" autocomplete="nickname"><label class="label">4-letter room code</label><div class="formrow"><input class="field codefield" id="joinCode" maxlength="4" placeholder="ABCD" autocomplete="off"><button class="btn primary" id="joinSubmit">Join room</button></div></div>';
if(kind==='create')document.getElementById('createSubmit').onclick=function(){send('create_room',{name:document.getElementById('createName').value})};else{var code=document.getElementById('joinCode');code.oninput=function(){code.value=code.value.toUpperCase().replace(/[^A-Z]/g,'')};document.getElementById('joinSubmit').onclick=function(){send('join_room',{name:document.getElementById('joinName').value,code:code.value})}}
}
function playerCards(players,hostId){if(!players||!players.length)return '<div class="empty">Waiting for players to join…</div>';return '<div class="players">'+players.map(function(p){return '<div class="player"><div class="person"><div class="avatar">'+esc(p.name.charAt(0).toUpperCase())+'</div><div class="playername">'+esc(p.name)+(p.id===hostId?' <span class="badge">Host</span>':'')+'</div></div><div class="badge"><i class="statusdot '+(p.connected?'':'off')+'"></i>'+(p.connected?'Here':'Away')+'</div></div>'}).join('')+'</div>'}
function lobby(){var r=state.room||{players:[],code:saved&&saved.code,hostPlayerId:null,canStart:false};var me=saved&&saved.playerId;return '<div class="layout"><main class="main"><div class="screenhead"><div><div class="eyebrow">Waiting room</div><h1>Gather your crew.</h1><div class="notice">Share this code with your friends. The game begins with 3–6 connected players.</div></div><div class="room-code">'+esc(r.code||'----')+'</div></div><section class="card"><div class="cardtitle">Crew <span>('+((r.players||[]).length)+'/6)</span></div>'+playerCards(r.players,r.hostPlayerId)+'</section><div class="roomfooter">'+(me===r.hostPlayerId?'<button class="btn primary" id="startBtn" '+(r.canStart?'':'disabled')+'>Start Game</button>':'<span class="notice">The host will start once at least 3 players are here.</span>')+'<span class="notice">'+(r.canStart?'Ready when you are.':'Need '+Math.max(0,3-(r.players||[]).filter(function(p){return p.connected}).length)+' more connected player(s).')+'</span></div>'+(state.error?'<div class="error">'+esc(state.error)+'</div>':'')+'<section class="card"><div class="cardtitle">At a glance</div><div class="rulecompact"><strong>SHARE:</strong> everyone shares → split evenly. <strong>GRAB:</strong> only grabbers split. <strong>All grab:</strong> alarm, nobody gets coins.<br>Insider gets one private hint each round. Choices are revealed together. 45 seconds to lock your choice.</div></section></main>'+rules()+'</div>'}
function roundView(){var r=state.round||{};var timerPct=Math.max(0,state.seconds)/45*100;var hint=state.hint?state.hint.state==='ready'?'<strong>INSIDER TIP</strong> · '+esc(state.hint.targetName)+' picked <strong>'+esc(state.hint.choice)+'</strong>. Keep it to yourself.':esc(state.hint.message||'Your informant was too slow this round.'):(r.insider?'<span style="color:#aaa">You are the Insider. Waiting for your informant…</span>':'<span style="color:#777">Your choice is private. Watch the clock.</span>');return '<div class="layout"><main class="main"><div class="roundtop"><div class="eyebrow">Round '+esc(r.round)+' of 5</div><h1>Make your move.</h1><div class="vault">THE VAULT <span class="vaultnum">'+esc(r.vault)+'</span> <span>coins</span></div><div class="timer"><div class="timerbar" id="timerbar" style="width:'+timerPct+'%"></div></div><div class="timerlabel" id="timerlabel">'+state.seconds+' seconds remaining</div></div><div class="secret">'+hint+'</div>'+(state.locked?'<div class="lockedbox"><strong>Choice locked.</strong><br>Your decision is sealed. Waiting for the crew…<br><span class="fine">'+state.lockedCount+' of '+state.total+' choices locked</span></div>':'<div class="choicebuttons"><button class="choice share" data-choice="SHARE">SHARE<span>Split the vault if all agree</span></button><button class="choice grab" data-choice="GRAB">GRAB<span>Take a cut if anyone shares</span></button></div>')+(state.error?'<div class="error">'+esc(state.error)+'</div>':'')+'<div class="card"><div class="cardtitle">Round rules</div><div class="rulecompact">Everyone shares: coins divide evenly. Any grabbers: only they split the vault. All grab: alarm, zero payout. Coins left over carry to next round. Your choice is hidden until reveal.</div></div></main>'+rules()+'</div>'}
function revealView(){var r=state.reveal;var title=r.outcome==='alarm'?'Alarm triggered. Nobody gets paid.':r.outcome==='share'?'The crew shared the vault.':'The grabbers split the vault.';var rows=r.players.map(function(p){var marker=p.autoReason==='disconnected'?' <span class="badge">(disconnected)</span>':p.autoReason==='timeout'?' <span class="badge">(timeout)</span>':'';return '<div class="resultrow"><span>'+esc(p.name)+marker+'</span><span class="pick '+esc(p.choice)+'">'+esc(p.choice)+'</span><span class="gain">+'+esc(p.gain)+'</span></div>'}).join('');return '<div class="layout"><main class="main"><div class="revealhead"><div class="eyebrow">Round '+r.round+' revealed</div><h1>The vault opens.</h1><div class="outcome">'+title+'</div></div><section class="card"><div class="cardtitle">Choices & updated scores</div><div class="resultgrid">'+rows+'</div></section><div class="carry">'+(r.coinsLeft>0?esc(r.coinsLeft)+' coin'+(r.coinsLeft===1?'':'s')+' left in the vault'+(r.round<5?' · carried into the next round':' · discarded after the final round'):'The vault was split evenly · no coins left over')+'</div><p class="fine" style="text-align:center;margin-top:18px">'+(r.round<5?(state.intermission?'Round '+state.intermission.nextRound+' begins shortly · next vault '+state.intermission.nextVault+' coins':'Next round begins shortly…'):'Final scoreboard coming up…')+'</p></main>'+rules()+'</div>'}
function finalView(){var f=state.final||{scoreboard:[],winnerIds:[]};var rows=f.scoreboard.map(function(p,i){return '<tr><td class="rank">'+(i+1)+'</td><td>'+esc(p.name)+(f.winnerIds.indexOf(p.id)>=0?' <span class="badge">Winner</span>':'')+'</td><td class="total">'+p.score+' coins</td></tr>'}).join('');var iAmHost=state.room&&saved&&state.room.hostPlayerId===saved.playerId;return '<div class="layout"><main class="main"><div class="revealhead"><div class="eyebrow">Five rounds complete</div><h1>Run complete.</h1><div class="outcome">'+(f.winnerIds.length>1?'A shared victory.':esc((f.scoreboard[0]||{}).name||'A winner')+' takes the vault.')+'</div></div><section class="card"><div class="cardtitle">Final scoreboard</div><table class="finaltable"><tbody>'+rows+'</tbody></table></section>'+(iAmHost?'<button class="btn primary" id="againBtn">Play Again</button>':'<div class="notice">Waiting for the host to start another game.</div>')+'</main>'+rules()+'</div>'}
function render(){if(state.screen==='home'){app.innerHTML=home();document.getElementById('createToggle').onclick=function(){form('create')};document.getElementById('joinToggle').onclick=function(){form('join')}}else if(state.screen==='lobby'){app.innerHTML=lobby();var b=document.getElementById('startBtn');if(b)b.onclick=function(){send('start_game')}}else if(state.screen==='round'){app.innerHTML=roundView();Array.prototype.forEach.call(document.querySelectorAll('[data-choice]'),function(b){b.onclick=function(){send('lock_choice',{choice:b.getAttribute('data-choice')})}})}else if(state.screen==='reveal'){app.innerHTML=revealView()}else if(state.screen==='final'){app.innerHTML=finalView();var a=document.getElementById('againBtn');if(a)a.onclick=function(){send('play_again')}}}
setInterval(function(){send('ping')},20000);
connect();render();
})();
</script></body></html>
